<style>
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --border: #e4e6ef;
  --text: #1c1e2b;
  --muted: #6b7084;
  --primary: #e5532d;
  --primary-hover: #c94320;
  --primary-text: #c2410c;
  --ink: #24262b;
  --primary-soft: #fff0ea;
  --green: #138a4e;
  --green-soft: #e5f6ed;
  --amber: #a15c00;
  --amber-soft: #fff3df;
  --red: #c4302b;
  --red-soft: #fdeceb;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 22, 40, .06), 0 2px 8px rgba(20, 22, 40, .04);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }
a { color: var(--primary-text); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 12px; }
h3 { font-size: 14px; margin: 0 0 8px; }

/* layout */
.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.sidebar { background: var(--ink); color: #c8cacf; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; font-size: 16px; padding: 4px 10px 18px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--primary); display: grid; place-items: center; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a8d95; padding: 14px 10px 4px; }
.sidebar a { color: #c8cacf; padding: 8px 10px; border-radius: 7px; display: block; }
.sidebar a:hover { background: #33363d; text-decoration: none; color: #fff; }
.sidebar a.active { background: var(--primary); color: #fff; }
.sidebar .me { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid #3a3d44; font-size: 13px; }
.sidebar .me .name { color: #fff; font-weight: 600; }
.sidebar .me button { margin-top: 8px; }
.main { padding: 28px 32px 60px; max-width: 1200px; width: 100%; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.stat .label { color: var(--muted); font-size: 12px; }
.stat .value { font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat.red .value { color: var(--red); }
.stat.green .value { color: var(--green); }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbfe; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.card.flush { padding: 0; overflow: hidden; }
.card.flush > h2 { padding: 16px 18px 0; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.sub { color: var(--muted); font-size: 12px; }

/* badges, progress */
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: #eef0f5; color: #4a4e63; }
.badge.green { background: var(--green-soft); color: var(--green); }
.badge.amber { background: var(--amber-soft); color: var(--amber); }
.badge.red { background: var(--red-soft); color: var(--red); }
.badge.blue { background: var(--primary-soft); color: var(--primary-text); }
.progress { height: 8px; background: #eceef5; border-radius: 99px; overflow: hidden; min-width: 80px; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.progress.done > span { background: var(--green); }
.progress-row { display: flex; align-items: center; gap: 8px; }
.progress-row .pct { font-size: 12px; color: var(--muted); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

/* forms */
label { display: block; font-size: 12px; font-weight: 600; color: #3d4157; margin-bottom: 4px; }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], input[type=url], input[type=search], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid #d3d6e2; border-radius: 7px; font: inherit; background: #fff; color: var(--text);
}
textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
.field { margin-bottom: 12px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: 14px; color: var(--text); }
.check input { width: 16px; height: 16px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filters > * { width: auto; min-width: 150px; }
.filters > button { min-width: 0; }

button, .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 7px; border: 1px solid #d3d6e2; background: #fff; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
button:hover, .btn:hover { background: #f3f4f9; text-decoration: none; }
button.primary, .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
button.primary:hover, .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
button.danger { color: var(--red); border-color: #f0c4c2; }
button.danger:hover { background: var(--red-soft); }
button.link { border: none; background: none; padding: 0; color: var(--primary-text); font-weight: 500; }
button.small, .btn.small { padding: 4px 10px; font-size: 12px; }
button:disabled { opacity: .55; cursor: not-allowed; }
.sidebar button { background: transparent; color: #c8cacf; border-color: #4a4d55; }
.sidebar button:hover { background: #33363d; }

/* module editor */
.block { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; background: #fcfcfe; }
.block-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.block-head strong { font-size: 13px; color: var(--muted); }
.option-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.option-row input[type=radio] { width: 16px; height: 16px; flex: none; }

/* learner */
.module-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.module-card { display: flex; flex-direction: column; gap: 10px; }
.module-card h3 { font-size: 16px; margin: 0; }
.module-card p { margin: 0; color: var(--muted); flex: 1; }
.module-card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.player { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
.toc { padding: 8px; position: sticky; top: 16px; }
.toc a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; color: var(--text); }
.toc a:hover { background: #f3f4f9; text-decoration: none; }
.toc a.active { background: var(--primary-soft); color: var(--primary-text); font-weight: 600; }
.toc a.locked { color: var(--muted); }
.dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #c8cbd8; flex: none; display: grid; place-items: center; font-size: 11px; color: #fff; }
.dot.done { background: var(--green); border-color: var(--green); }
.lesson-content { font-size: 15px; line-height: 1.7; }
.lesson-content h2 { font-size: 20px; margin: 18px 0 8px; }
.lesson-content h3 { font-size: 17px; margin: 16px 0 6px; }
.lesson-content h4 { font-size: 15px; margin: 14px 0 6px; }
.video { position: relative; padding-top: 56.25%; margin-bottom: 16px; border-radius: var(--radius); overflow: hidden; background: #000; }
.video iframe, .video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.lesson-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
.question { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.question .q { font-weight: 600; margin-bottom: 8px; }
.question label.opt { display: flex; gap: 10px; align-items: center; font-weight: 400; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px; cursor: pointer; color: var(--text); }
.question label.opt:hover { background: #f8f9fc; }
.question label.opt.right { border-color: var(--green); background: var(--green-soft); }
.question.wrong .q::after { content: " ✗"; color: var(--red); }
.question.right .q::after { content: " ✓"; color: var(--green); }
.result { padding: 14px 16px; border-radius: var(--radius); margin-bottom: 16px; font-weight: 600; }
.result.pass { background: var(--green-soft); color: var(--green); }
.result.fail { background: var(--red-soft); color: var(--red); }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 85% 15%, rgba(246,92,54,.35), transparent 45%), var(--ink); }
.login .card { width: 100%; max-width: 380px; padding: 28px; }
.login h1 { margin-bottom: 4px; }
.login p { color: var(--muted); margin: 0 0 20px; }
.demo { margin-top: 16px; font-size: 12px; color: var(--muted); background: #f6f7fb; border-radius: 7px; padding: 10px; }

/* dialog, toast */
dialog { border: none; border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(20, 22, 40, .45); }
dialog form, dialog .dlg { padding: 22px; }
dialog .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.pick-list { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 7px; padding: 6px; }
.pick-list label { display: flex; gap: 8px; align-items: center; font-weight: 400; font-size: 13px; padding: 5px 6px; border-radius: 5px; color: var(--text); margin: 0; }
.pick-list label:hover { background: #f3f4f9; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1c1e2b; color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); z-index: 100; max-width: calc(100vw - 32px); }
.toast.error { background: var(--red); }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px; }
  .brand { padding: 4px 10px; }
  .nav-label { display: none; }
  .sidebar .me { margin: 0 0 0 auto; border: none; padding: 0; display: flex; gap: 8px; align-items: center; }
  .sidebar .me button { margin: 0; }
  .main { padding: 16px; }
  .grid-2, .player { grid-template-columns: 1fr; }
  .toc { position: static; }
}
.demo .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* branding */
.brand-logo { display: block; height: 56px; width: auto; max-width: 100%; }
.brand-sub { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8a8d95; font-weight: 600; margin-top: 6px; }
.brand.with-logo { flex-direction: column; align-items: flex-start; gap: 0; }
.login-logo { height: 76px; width: auto; max-width: 100%; margin-bottom: 18px; }

/* uploads */
.upload-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.upload-row input[type=file] { display: none; }
.upload-status { font-size: 12px; color: var(--muted); }
.lesson-preview video { width: 100%; max-height: 240px; border-radius: 8px; background: #000; margin-top: 8px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
.tabs button.on { color: var(--primary-text); border-bottom-color: var(--primary); }
.drop { border: 2px dashed #d3d6e2; border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--primary); background: var(--primary-soft); }
.preview-table { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 7px; margin-top: 10px; font-size: 13px; }
.preview-table td, .preview-table th { padding: 6px 8px; }

/* Google sign-in and the bulk-assign sample file */
.google-btn { width: 100%; justify-content: center; gap: 10px; font-weight: 600; padding: 10px 14px; background: #fff; color: var(--ink); border: 1px solid var(--border); text-decoration: none; }
.google-btn:hover { background: #f6f7fb; }
.login-hint { text-align: center; margin-top: 8px; }
.login-or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 16px 0; }
.login-or::before, .login-or::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
.login-error { background: var(--red-soft); color: var(--red); border-radius: 7px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
.sample-file { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--primary-soft); border-radius: 8px; padding: 12px; font-size: 13px; }
.sample-file .btn { white-space: nowrap; }
.nowrap { white-space: nowrap; }
details.sub summary { cursor: pointer; margin: 8px 0; }
.complete-wrap { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }

.demo-bar { background: var(--amber-soft); color: var(--amber); font-size: 13px; padding: 8px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; }
.demo-bar button { padding: 3px 10px; font-size: 12px; }
</style>

<script>window.LMS_SEED = {"buildDate":"2026-10-14","tables":{"users":[{"id":1,"name":"Admin","email":"admin@company.com","role":"admin","department":"HR","designation":"L&D Admin","joining_date":"2024-01-01","active":1,"created_at":"2026-10-14 11:45:22","password":"admin123"},{"id":2,"name":"Priya Sharma","email":"priya@company.com","role":"employee","department":"Engineering","designation":"Software Engineer","joining_date":"2026-10-11","active":1,"created_at":"2026-10-14 11:45:23","password":"welcome123"},{"id":3,"name":"Arjun Mehta","email":"arjun@company.com","role":"employee","department":"Sales","designation":"Account Executive","joining_date":"2026-10-04","active":1,"created_at":"2026-10-14 11:45:23","password":"welcome123"},{"id":4,"name":"Neha Gupta","email":"neha@company.com","role":"employee","department":"Marketing","designation":"Marketing Manager","joining_date":"2025-09-09","active":1,"created_at":"2026-10-14 11:45:23","password":"welcome123"}],"modules":[{"id":1,"title":"Welcome to the Company","description":"Our story, values, and how we work together. Every new joiner starts here.","category":"Onboarding","is_onboarding":1,"onboarding_departments":"","due_days":7,"pass_mark":70,"published":1,"created_at":"2026-10-14 11:45:22","updated_at":"2026-10-14 11:45:22"},{"id":2,"title":"Information Security Basics","description":"Protect company and customer data: passwords, phishing, devices and reporting incidents.","category":"Compliance","is_onboarding":1,"onboarding_departments":"","due_days":14,"pass_mark":80,"published":1,"created_at":"2026-10-14 11:45:22","updated_at":"2026-10-14 11:45:22"},{"id":3,"title":"Sales Playbook Essentials","description":"Onboarding for the Sales team: pipeline stages, qualification and CRM hygiene.","category":"Onboarding","is_onboarding":1,"onboarding_departments":"Sales","due_days":21,"pass_mark":70,"published":1,"created_at":"2026-10-14 11:45:22","updated_at":"2026-10-14 11:45:22"},{"id":4,"title":"POSH Awareness (Prevention of Sexual Harassment)","description":"Annual refresher on a safe and respectful workplace. Assigned as needed.","category":"Compliance","is_onboarding":0,"onboarding_departments":"","due_days":14,"pass_mark":80,"published":1,"created_at":"2026-10-14 11:45:22","updated_at":"2026-10-14 11:45:22"},{"id":5,"title":"Giving and Receiving Feedback","description":"A short skills module for new managers and anyone who wants to grow. Assigned as needed.","category":"Skills","is_onboarding":0,"onboarding_departments":"","due_days":30,"pass_mark":60,"published":1,"created_at":"2026-10-14 11:45:22","updated_at":"2026-10-14 11:45:22"}],"lessons":[{"id":1,"module_id":1,"position":0,"title":"Our story and mission","content":"# Who we are\nWe started with a simple idea: make complex decisions easier for millions of people.\n\n## Our mission\n- Put the customer first in every decision\n- Build with **integrity** and transparency\n- Move fast, learn faster\n\nTake a few minutes to explore the company intranet and meet your team.","video_url":""},{"id":2,"module_id":1,"position":1,"title":"Our values in practice","content":"# Values you will see every day\n- **Ownership**: treat problems as your own and see them through\n- **Candour**: share honest feedback kindly and early\n- **Customer obsession**: start from what the customer needs\n- **Learning**: stay curious and help others grow\n\nYour manager will walk you through how your team applies these values.","video_url":""},{"id":3,"module_id":1,"position":2,"title":"Your first 30 days","content":"# What to expect\n- Week 1: set up your accounts, meet your buddy and team\n- Week 2: shadow colleagues and complete your onboarding modules\n- Weeks 3-4: take on your first piece of real work\n\nAsk questions early. Nobody expects you to know everything yet.","video_url":""},{"id":4,"module_id":2,"position":0,"title":"Passwords and MFA","content":"# Strong access habits\n- Use a password manager and a unique password for every system\n- Always turn on multi-factor authentication (MFA)\n- Never share your credentials, not even with IT\n\nIT will **never** ask for your password.","video_url":""},{"id":5,"module_id":2,"position":1,"title":"Spotting phishing","content":"# Phishing red flags\n- Urgent language or threats\n- Sender address that does not match the company domain\n- Unexpected attachments or login links\n\nWhen in doubt, do not click. Report the email to the security team.","video_url":""},{"id":6,"module_id":2,"position":2,"title":"Reporting an incident","content":"# If something goes wrong\nReport lost devices, suspicious emails and accidental data sharing **immediately** to the security team. Fast reporting limits the damage. You will never be penalised for reporting in good faith.","video_url":""},{"id":7,"module_id":3,"position":0,"title":"Pipeline stages","content":"# Our pipeline\n- Lead\n- Qualified\n- Proposal\n- Negotiation\n- Closed won / Closed lost\n\nMove a deal forward only when its exit criteria are met.","video_url":""},{"id":8,"module_id":3,"position":1,"title":"CRM hygiene","content":"# Keep the CRM clean\nLog every call and meeting on the same day, keep the next step and close date up to date, and never leave a deal without an owner.","video_url":""},{"id":9,"module_id":4,"position":0,"title":"A safe workplace","content":"# Our commitment\nEveryone deserves a workplace free from harassment. This module explains what harassment is, how to raise a concern and how the Internal Committee handles complaints confidentially.","video_url":""},{"id":10,"module_id":4,"position":1,"title":"Raising a concern","content":"# How to raise a concern\n- Write to the Internal Committee (IC)\n- Speak to your HR business partner\n- Complaints are handled confidentially and retaliation is not tolerated","video_url":""},{"id":11,"module_id":5,"position":0,"title":"The SBI model","content":"# Situation, Behaviour, Impact\nDescribe the **situation**, the specific **behaviour** you observed, and its **impact**. It keeps feedback concrete and fair.","video_url":""}],"questions":[{"id":1,"module_id":1,"position":0,"text":"Which value means treating problems as your own and seeing them through?","options":"[\"Candour\",\"Ownership\",\"Learning\",\"Customer obsession\"]","correct_index":1},{"id":2,"module_id":1,"position":1,"text":"What should you do in your first week?","options":"[\"Ship a major project\",\"Set up accounts and meet your buddy and team\",\"Skip onboarding modules\",\"Plan the annual budget\"]","correct_index":1},{"id":3,"module_id":2,"position":0,"text":"IT asks you for your password over chat. What should you do?","options":"[\"Share it, IT needs it\",\"Refuse and report it to security\",\"Share only half of it\",\"Change it after sharing\"]","correct_index":1},{"id":4,"module_id":2,"position":1,"text":"Which is a common phishing red flag?","options":"[\"An email from your manager about lunch\",\"Urgent language with an unexpected login link\",\"A calendar invite for a team meeting\",\"A newsletter you subscribed to\"]","correct_index":1},{"id":5,"module_id":2,"position":2,"text":"You lost your laptop. When should you report it?","options":"[\"After a week of searching\",\"Only if it had customer data\",\"Immediately\",\"Never\"]","correct_index":2},{"id":6,"module_id":3,"position":0,"text":"When should you log a customer call in the CRM?","options":"[\"At the end of the quarter\",\"The same day\",\"Only if the deal closes\",\"Never\"]","correct_index":1},{"id":7,"module_id":4,"position":0,"text":"Who handles harassment complaints?","options":"[\"Your direct teammates\",\"The Internal Committee\",\"Customers\",\"Nobody\"]","correct_index":1},{"id":8,"module_id":5,"position":0,"text":"What does SBI stand for?","options":"[\"Simple, Brief, Informal\",\"Situation, Behaviour, Impact\",\"Skills, Benefits, Ideas\",\"Start, Build, Improve\"]","correct_index":1}],"assignments":[{"id":1,"module_id":1,"user_id":2,"source":"onboarding","assigned_by <script>
// In-browser stand-in for server.js, used only by the one-file demo build.
// It answers the same /api routes from data kept in the browser, so the real app.js runs unchanged.
(function () {
  'use strict';
  window.LMS_DEMO = true;
  const KEY = 'learning-hub-demo-v1';
  const SEED = window.LMS_SEED;
  const DEFAULT_PASSWORD = 'welcome123';

  // ---------- dates ----------
  function today() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  function addDays(dateStr, n) {
    const d = new Date(`${dateStr.slice(0, 10)}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() + Number(n || 0));
    return d.toISOString().slice(0, 10) + dateStr.slice(10);
  }
  const nowStr = () => new Date().toISOString().slice(0, 19).replace('T', ' ');
  const daysBetween = (a, b) => Math.round((new Date(`${b}T00:00:00Z`) - new Date(`${a}T00:00:00Z`)) / 864e5);

  // ---------- store ----------
  function fresh() {
    const s = JSON.parse(JSON.stringify(SEED.tables));
    // Seed dates are relative to when the demo was built; move them so "joined 3 days ago" stays true.
    const shift = daysBetween(SEED.buildDate, today());
    const move = (v) => (v ? addDays(v, shift) : v);
    s.users.forEach((u) => { u.joining_date = move(u.joining_date); u.created_at = move(u.created_at); });
    s.modules.forEach((m) => { m.created_at = move(m.created_at); m.updated_at = move(m.updated_at); });
    s.assignments.forEach((a) => { ['assigned_at', 'due_date', 'started_at', 'completed_at'].forEach((k) => { a[k] = move(a[k]); }); });
    s.lesson_progress.forEach((p) => { p.completed_at = move(p.completed_at); });
    s.quiz_attempts.forEach((t) => { t.created_at = move(t.created_at); });
    s.session = null;
    return s;
  }
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { S = fresh(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* storage unavailable: keep in memory */ } };
  window.LMS_RESET_DEMO = () => {
    try { localStorage.removeItem(KEY); } catch { /* ignore */ }
    try { indexedDB.deleteDatabase(VIDEO_DB); } catch { /* ignore */ }
    location.hash = '';
    location.reload();
  };

  // ---------- uploaded videos (kept in this browser's IndexedDB, or in memory if that is blocked) ----------
  const VIDEO_DB = 'learning-hub-demo-videos';
  const memoryVideos = new Map();
  const openVideoDb = () => new Promise((resolve, reject) => {
    const r = indexedDB.open(VIDEO_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('videos');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
  async function putVideo(id, blob) {
    memoryVideos.set(id, blob);
    try {
      const d = await openVideoDb();
      await new Promise((resolve, reject) => { const t = d.transaction('videos', 'readwrite'); t.objectStore('videos').put(blob, id); t.oncomplete = resolve; t.onerror = () => reject(t.error); });
    } catch { /* memory copy still works for this visit */ }
  }
  async function getVideo(id) {
    if (memoryVideos.has(id)) return memoryVideos.get(id);
    try {
      const d = await openVideoDb();
      return await new Promise((resolve) => { const r = d.transaction('videos').objectStore('videos').get(id); r.onsuccess = () => resolve(r.result || null); r.onerror = () => resolve(null); });
    } catch { return null; }
  }
  const objectUrls = new Map();
  window.LMS_HYDRATE_VIDEOS = async (root) => {
    for (const v of root.querySelectorAll('video[data-demo-video]')) {
      const id = v.dataset.demoVideo;
      if (!objectUrls.has(id)) {
        const blob = await getVideo(id);
        if (!blob) { v.outerHTML = '<p class="sub">This video was uploaded in another browser, so it can\'t be shown here.</p>'; continue; }
        objectUrls.set(id, URL.createObjectURL(blob));
      }
      v.src = objectUrls.get(id);
    }
  };

  const nextId = (table) => S[table].reduce((m, r) => Math.max(m, r.id || 0), 0) + 1;
  const userById = (id) => S.users.find((u) => u.id === id);
  const fail = (status, message) => { const e = new Error(message); e.status = status; throw e; };
  const str = (v, max = 5000) => String(v ?? '').trim().slice(0, max);
  const isDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(String(v || ''));
  const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || ''));
  const toInt = (v, fb) => (v !== null && v !== undefined && String(v).trim() !== '' && Number.isFinite(Number(v)) ? Math.round(Number(v)) : fb);
  const byName = (a, b) => a.name.localeCompare(b.name);

  // ---------- domain logic (mirrors db.js / server.js) ----------
  const lessonsOf = (mid) => S.lessons.filter((l) => l.module_id === mid).sort((a, b) => a.position - b.position);
  const questionsOf = (mid) => S.questions.filter((q) => q.module_id === mid).sort((a, b) => a.position - b.position);

  function departmentMatches(list, dept) {
    const items = String(list || '').split(',').map((s) => s.trim().toLowerCase()).filter(Boolean);
    return !items.length || items.includes(String(dept || '').trim().toLowerCase());
  }

  function assignOnboarding(userId, by) {
    const u = userById(userId);
    if (!u) return 0;
    let n = 0;
    for (const m of S.modules.filter((x) => x.is_onboarding && x.published)) {
      if (!departmentMatches(m.onboarding_departments, u.department)) continue;
      if (S.assignments.some((a) => a.module_id === m.id && a.user_id === u.id)) continue;
      S.assignments.push({ id: nextId('assignments'), module_id: m.id, user_id: u.id, source: 'onboarding', assigned_by: by ?? null, note: '', assigned_at: nowStr(), due_date: addDays(u.joining_date, m.due_days), status: 'assigned', started_at: null, completed_at: null, best_score: null });
      n++;
    }
    return n;
  }

  function counts(a) {
    const lessons = lessonsOf(a.module_id);
    const ids = new Set(lessons.map((l) => l.id));
    return {
      lessons_total: lessons.length,
      lessons_done: S.lesson_progress.filter((p) => p.assignment_id === a.id && ids.has(p.lesson_id)).length,
      questions_total: questionsOf(a.module_id).length,
      quiz_passed: S.quiz_attempts.some((t) => t.assignment_id === a.id && t.passed) ? 1 : 0,
      attempts: S.quiz_attempts.filter((t) => t.assignment_id === a.id).length,
    };
  }

  function refreshStatus(a) {
    const c = counts(a);
    const complete = c.lessons_done >= c.lessons_total && (c.questions_total === 0 || c.quiz_passed);
    const status = complete ? 'completed' : c.lessons_done > 0 || c.attempts > 0 ? 'in_progress' : 'assigned';
    a.status = status;
    if (status !== 'assigned' && !a.started_at) a.started_at = nowStr();
    a.completed_at = status === 'completed' ? a.completed_at || nowStr() : null;
  }

  function decorate(a) {
    const m = S.modules.find((x) => x.id === a.module_id);
    const u = userById(a.user_id);
    const ab = userById(a.assigned_by);
    const c = counts(a);
    const hasQuiz = c.questions_total > 0;
    const steps = c.lessons_total + (hasQuiz ? 1 : 0);
    const done = c.lessons_done + (hasQuiz && c.quiz_passed ? 1 : 0);
    return {
      ...a, module_title: m.title, module_category: m.category, module_description: m.description, pass_mark: m.pass_mark,
      user_name: u.name, user_email: u.email, user_department: u.department, assigned_by_name: ab ? ab.name : null,
      lessons_total: c.lessons_total, lessons_done: c.lessons_done, questions_total: c.questions_total, quiz_passed: c.quiz_passed,
      progress: a.status === 'completed' ? 100 : steps ? Math.round((done / steps) * 100) : 0,
      overdue: a.status !== 'completed' && a.due_date < today(),
    };
  }
  const sortAssign = (x, y) => (x.due_date < y.due_date ? -1 : x.due_date > y.due_date ? 1 : x.user_name.localeCompare(y.user_name));

  function moduleFull(id, includeAnswers) {
    const m = S.modules.find((x) => x.id === id);
    if (!m) fail(404, 'Module not found');
    return {
      ...m,
      lessons: lessonsOf(id).map((l) => ({ ...l })),
      questions: questionsOf(id).map((q) => {
        const o = { id: q.id, text: q.text, options: JSON.parse(q.options) };
        if (includeAnswers) o.correct_index = q.correct_index;
        return o;
      }),
    };
  }

  function validateModule(b) {
    const title = str(b.title, 200);
    if (!title) fail(400, 'Module title is required');
    const lessons = Array.isArray(b.lessons) ? b.lessons : [];
    if (!lessons.length) fail(400, 'Add at least one lesson');
    lessons.forEach((l, i) => { if (!str(l.title)) fail(400, `Lesson ${i + 1} needs a title`); });
    const questions = (Array.isArray(b.questions) ? b.questions : []).map((q, i) => {
      const options = (q.options || []).map((o) => str(o, 500)).filter(Boolean);
      if (!str(q.text)) fail(400, `Question ${i + 1} needs text`);
      if (options.length < 2) fail(400, `Question ${i + 1} needs at least two options`);
      const c = toInt(q.correct_index, -1);
      if (c < 0 || c >= options.length) fail(400, `Pick the correct answer for question ${i + 1}`);
      return { text: str(q.text, 1000), options, correct_index: c };
    });
    return {
      title, description: str(b.description, 2000), category: str(b.category, 100),
      is_onboarding: b.is_onboarding ? 1 : 0, onboarding_departments: str(b.onboarding_departments, 500),
      due_days: Math.max(0, toInt(b.due_days, 7)), pass_mark: Math.min(100, Math.max(0, toInt(b.pass_mark, 70))),
      published: b.published === false || b.published === 0 ? 0 : 1,
      lessons: lessons.map((l) => ({ id: toInt(l.id, null), title: str(l.title, 200), content: str(l.content, 100000), video_url: str(l.video_url, 1000) })),
      questions,
    };
  }

  function saveModule(id, d) {
    const { lessons, questions, ...fields } = d;
    let m;
    if (id) {
      m = S.modules.find((x) => x.id === id);
      if (!m) fail(404, 'Module not found');
      Object.assign(m, fields, { updated_at: nowStr() });
    } else {
      m = { id: nextId('modules'), ...fields, created_at: nowStr(), updated_at: nowStr() };
      S.modules.push(m);
    }
    const existing = new Set(S.lessons.filter((l) => l.module_id === m.id).map((l) => l.id));
    const kept = new Set();
    lessons.forEach((l, i) => {
      if (l.id && existing.has(l.id)) {
        Object.assign(S.lessons.find((x) => x.id === l.id), { position: i, title: l.title, content: l.content, video_url: l.video_url });
        kept.add(l.id);
      } else {
        S.lessons.push({ id: nextId('lessons'), module_id: m.id, position: i, title: l.title, content: l.content, video_url: l.video_url });
      }
    });
    const removed = [...existing].filter((x) => !kept.has(x));
    S.lessons = S.lessons.filter((l) => !removed.includes(l.id));
    S.lesson_progress = S.lesson_progress.filter((p) => !removed.includes(p.lesson_id));
    S.questions = S.questions.filter((q) => q.module_id !== m.id);
    questions.forEach((q, i) => S.questions.push({ id: nextId('questions'), module_id: m.id, position: i, text: q.text, options: JSON.stringify(q.options), correct_index: q.correct_index }));
    S.assignments.filter((a) => a.module_id === m.id && a.status !== 'completed').forEach(refreshStatus);
    return m.id;
  }

  function deleteAssignments(pred) {
    const gone = new Set(S.assignments.filter(pred).map((a) => a.id));
    S.assignments = S.assignments.filter((a) => !gone.has(a.id));
    S.lesson_progress = S.lesson_progress.filter((p) => !gone.has(p.assignment_id));
    S.quiz_attempts = S.quiz_attempts.filter((t) => !gone.has(t.assignment_id));
    return gone.size;
  }

  function validateEmployee(b) {
    const e = {
      name: str(b.name, 200), email: str(b.email, 200).toLowerCase(), department: str(b.department, 100),
      designation: str(b.designation, 100), joining_date: str(b.joining_date, 10) || today(), role: b.role === 'admin' ? 'admin' : 'employee',
    };
    if (!e.name) fail(400, 'Name is required');
    if (!isEmail(e.email)) fail(400, `Invalid email: ${e.email || '(blank)'}`);
    if (!isDate(e.joining_date)) fail(400, 'Joining date must be YYYY-MM-DD');
    return e;
  }

  function createEmployee(b, adminId) {
    const e = validateEmployee(b);
    if (b.password && String(b.password).length < 6) fail(400, 'Password must be at least 6 characters');
    if (S.users.some((u) => u.email === e.email)) fail(409, `${e.email} already exists`);
    const id = nextId('users');
    S.users.push({ id, ...e, password: String(b.password || DEFAULT_PASSWORD), active: 1, created_at: nowStr() });
    return { id, onboarding_assigned: b.assign_onboarding === false ? 0 : assignOnboarding(id, adminId) };
  }

  function parseCsv(text) {
    return String(text || '').split(/\r?\n/).filter((l) => l.trim()).map((line) => {
      const cells = []; let cur = ''; let q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
        else if (c === '"') q = true; else if (c === ',') { cells.push(cur); cur = ''; } else cur += c;
      }
      cells.push(cur);
      return cells.map((c) => c.trim());
    });
  }

  function listAssignments(q) {
    const t = today();
    const s = (q.get('search') || '').toLowerCase();
    return S.assignments.map(decorate).filter((a) =>
      (!q.get('module_id') || a.module_id === Number(q.get('module_id')))
      && (!q.get('user_id') || a.user_id === Number(q.get('user_id')))
      && (!q.get('department') || a.user_department === q.get('department'))
      && (!q.get('source') || a.source === q.get('source'))
      && (!q.get('status') || (q.get('status') === 'overdue' ? a.status !== 'completed' && a.due_date < t : a.status === q.get('status')))
      && (!s || `${a.user_name} ${a.user_email} ${a.module_title}`.toLowerCase().includes(s))).sort(sortAssign);
  }

    routes.push({ method, re, keys, role, fn });
  };

  route('GET', '/dashboard', 'admin', () => {
    const t = today();
    const all = S.assignments.map(decorate);
    const od = (a) => a.status !== 'completed' && a.due_date < t;
    const group = (keyFn) => {
      const map = new Map();
      all.forEach((a) => { const k = keyFn(a); const g = map.get(k) || { assigned: 0, completed: 0, overdue: 0 }; g.assigned++; if (a.status === 'completed') g.completed++; if (od(a)) g.overdue++; map.set(k, g); });

      newJoiners: S.users.filter((u) => u.active && u.role === 'employee' && u.joining_date >= addDays(t, -30))

        .map((u) => ({ id: u.id, name: u.name, department: u.department, designation: u.designation, joining_date: u.joining_date })),
    };
  });

  route('GET', '/employees', 'admin', () => {
    const t = today();

  route('POST', '/employees', 'admin', ({ body, user }) => createEmployee(body, user.id));
  route('POST', '/employees/import', 'admin', ({ body, user }) => {

    if (Array.isArray(body.rows)) rows = body.rows;
    else {
      const csv = parseCsv(body.csv);
      firstRow = 1;

      rows = csv.map(([name, email, department, designation, joining_date, role]) => ({ name, email, department, designation, joining_date, role }));
    }
    const created = []; const errors = [];
    rows.forEach((r, i) => {
      const email = str(r.email, 200).toLowerCase();
      const role = String(r.role || '').trim().toLowerCase() === 'admin' ? 'admin' : 'employee';
      try { created.push(createEmployee({ ...r, email, role, assign_onboarding: body.assign_onboarding !== false }, user.id)); }
      catch (e) { errors.push({ row: i + firstRow, email, error: e.message }); }
    });
    return { created: created.length, onboarding_assigned: created.reduce((s, c) => s + c.onboarding_assigned, 0), errors };
  });
  route('PUT', '/employees/:id/role', 'admin', ({ params, body, user }) => {
    const id = Number(params.id);
    const role = body.role === 'admin' ? 'admin' : 'employee';
    if (id === user.id && role !== 'admin') fail(400, 'You cannot remove your own admin access');
    const u = userById(id);
    if (!u) fail(404, 'Employee not found');
    u.role = role;
    return { ok: true, role };
  });
  route('GET', '/employees/:id', 'admin', ({ params }) => {
    const u = userById(Number(params.id));
    if (!u) fail(404, 'Employee not found');
    return { ...publicUser(u), active: u.active, created_at: u.created_at, assignments: S.assignments.filter((a) => a.user_id === u.id).map(decorate).sort((a, b) => (a.due_date > b.due_date ? 1 : -1)) };
  });
  route('PUT', '/employees/:id', 'admin', ({ params, body, user }) => {
    const id = Number(params.id);
    const u = userById(id);
    if (!u) fail(404, 'Employee not found');
    const e = validateEmployee(body);
    const active = body.active === false || body.active === 0 ? 0 : 1;
    if (id === user.id && (!active || e.role !== 'admin')) fail(400, 'You cannot deactivate or demote yourself');
    if (S.users.some((x) => x.email === e.email && x.id !== id)) fail(409, `${e.email} already exists`);
    if (body.password && String(body.password).length < 6) fail(400, 'Password must be at least 6 characters');
    Object.assign(u, e, { active });
    if (body.password) u.password = String(body.password);
    return { ok: true };
  });
  route('POST', '/employees/:id/onboarding', 'admin', ({ params, user }) => ({ assigned: assignOnboarding(Number(params.id), user.id) }));

  route('GET', '/modules', 'admin', () => [...S.modules].sort((a, b) => b.is_onboarding - a.is_onboarding || a.title.localeCompare(b.title)).map((m) => {
    const as = S.assignments.filter((a) => a.module_id === m.id);
    return { ...m, lessons_count: lessonsOf(m.id).length, questions_count: questionsOf(m.id).length, assigned: as.length, completed: as.filter((a) => a.status === 'completed').length };
  }));
  route('GET', '/modules/:id', 'admin', ({ params }) => moduleFull(Number(params.id), true));
  route('POST', '/modules', 'admin', ({ body }) => ({ id: saveModule(null, validateModule(body)) }));
  route('PUT', '/modules/:id', 'admin', ({ params, body }) => ({ id: saveModule(Number(params.id), validateModule(body)) }));
  route('DELETE', '/modules/:id', 'admin', ({ params }) => {
    const id = Number(params.id);
    if (!S.modules.some((m) => m.id === id)) fail(404, 'Module not found');
    deleteAssignments((a) => a.module_id === id);
    S.modules = S.modules.filter((m) => m.id !== id);
    S.lessons = S.lessons.filter((l) => l.module_id !== id);
    S.questions = S.questions.filter((q) => q.module_id !== id);
    return { ok: true };
  });

  route('GET', '/assignments', 'admin', ({ query }) => listAssignments(query));
  route('POST', '/assignments', 'admin', ({ body, user }) => {
    const m = S.modules.find((x) => x.id === Number(body.module_id));
    if (!m) fail(400, 'Choose a module');
    const ids = [...new Set((body.user_ids || []).map(Number).filter(Boolean))];
    if (!ids.length) fail(400, 'Choose at least one employee');
    const due = str(body.due_date, 10) || addDays(today(), m.due_days);
    if (!isDate(due)) fail(400, 'Due date must be YYYY-MM-DD');
    let created = 0; let skipped = 0;
    for (const uid of ids) {
      if (!userById(uid) || S.assignments.some((a) => a.module_id === m.id && a.user_id === uid && a.status !== 'completed')) { skipped++; continue; }
      S.assignments.push({ id: nextId('assignments'), module_id: m.id, user_id: uid, source: 'manual', assigned_by: user.id, note: str(body.note, 500), assigned_at: nowStr(), due_date: due, status: 'assigned', started_at: null, completed_at: null, best_score: null });
      created++;
    }
    return { created, skipped };
  });
  route('POST', '/assignments/bulk', 'admin', ({ body, user }) => {
    const m = S.modules.find((x) => x.id === Number(body.module_id));
    if (!m) fail(400, 'Choose a module');
    const due = str(body.due_date, 10) || addDays(today(), m.due_days);
    if (!isDate(due)) fail(400, 'Due date must be YYYY-MM-DD');
    const rows = Array.isArray(body.rows) ? body.rows.slice(0, 5000) : [];
    if (!rows.length) fail(400, 'The sheet has no rows');
    const result = { created: 0, skipped: 0, new_employees: 0, errors: [] };
    const seen = new Set();
    rows.forEach((r, i) => {
      const email = str(r.email, 200).toLowerCase();
      try {
        if (!isEmail(email)) fail(400, `Invalid email "${email || '(blank)'}"`);
        if (seen.has(email)) fail(400, `${email} appears more than once`);
        seen.add(email);
        let u = S.users.find((x) => x.email === email);
        if (u && !u.active) fail(400, `${email} is deactivated`);
        if (!u) {
          if (!body.create_missing) fail(400, `${email} is not in the system`);
          if (!str(r.name)) fail(400, `${email} is new, so the Name column is needed`);
          u = userById(createEmployee({ ...r, email, role: 'employee' }, user.id).id);
          result.new_employees++;
        }
        if (S.assignments.some((a) => a.module_id === m.id && a.user_id === u.id && a.status !== 'completed')) { result.skipped++; return; }
        S.assignments.push({ id: nextId('assignments'), module_id: m.id, user_id: u.id, source: 'manual', assigned_by: user.id, note: str(body.note, 500), assigned_at: nowStr(), due_date: due, status: 'assigned', started_at: null, completed_at: null, best_score: null });
        result.created++;
      } catch (e) {
        if (!e.status) throw e;
        result.errors.push({ row: i + 2, email, error: e.message });
      }
    });
    return result;
  });
  route('POST', '/uploads', 'admin', async ({ body, query }) => {

  });
  route('PUT', '/assignments/:id', 'admin', ({ params, body }) => {
    if (!isDate(body.due_date)) fail(400, 'Due date must be YYYY-MM-DD');

  route('DELETE', '/assignments/:id', 'admin', ({ params }) => {

  const isTrackedVideo = (url) => /^\/(uploads|api\/media)\//.test(url || '') || /^demo-video:/.test(url || '')
    || /^https:\/\/[\w-]+\.public\.blob\.vercel-storage\.com\//.test(url || '') || /^https?:\/\/\S+\.(mp4|webm|ogg)(\?|$)/i.test(url || '');
  route('GET', '/my/assignments', 'user', ({ user }) => S.assignments.filter((a) => a.user_id === user.id).map(decorate)
    .sort((a, b) => (a.status === 'completed') - (b.status === 'completed') || (a.due_date > b.due_date ? 1 : a.due_date < b.due_date ? -1 : 0)));
  route('GET', '/my/assignments/:id', 'user', ({ user, params }) => {
    const a = decorate(myAssignment(user, params.id));
    const m = moduleFull(a.module_id, false);
    const done = new Set(S.lesson_progress.filter((p) => p.assignment_id === a.id).map((p) => p.lesson_id));

    m.lessons = m.lessons.map((l) => {

      return { ...l, done: done.has(l.id), must_watch: isTrackedVideo(l.video_url), video_watched: v?.watched || 0, video_duration: v?.duration || 0 };
    });
    const attempts = S.quiz_attempts.filter((t) => t.assignment_id === a.id).sort((x, y) => y.id - x.id).map(({ id, score, passed, created_at }) => ({ id, score, passed, created_at }));
    return { assignment: a, module: m, attempts };
  });
  route('POST', '/my/assignments/:id/lessons/:lessonId/complete', 'user', ({ user, params }) => {

    if (!l) fail(404, 'Lesson not found');

    if (isTrackedVideo(l.video_url) && !already) {
      const v = (S.video_progress || []).find((p) => p.assignment_id === a.id && p.lesson_id === l.id && p.video_url === l.video_url);
      if (!(v && v.duration > 0 && v.watched >= v.duration - 2)) fail(400, 'Please watch the full video before marking this lesson complete');
    }
    if (!already) S.lesson_progress.push({ assignment_id: a.id, lesson_id: l.id, completed_at: nowStr() });
    refreshStatus(a);
    return decorate(a);
  });
  route('POST', '/my/assignments/:id/lessons/:lessonId/video', 'user', ({ user, params, body }) => {
    const a = myAssignment(user, params.id);
    const l = S.lessons.find((x) => x.id === Number(params.lessonId) && x.module_id === a.module_id);
    if (!l) fail(404, 'Lesson not found');
    S.video_progress ||= [];
    let v = S.video_progress.find((p) => p.assignment_id === a.id && p.lesson_id === l.id);
    if (!v || v.video_url !== l.video_url) {
      S.video_progress = S.video_progress.filter((p) => p !== v);
      v = { assignment_id: a.id, lesson_id: l.id, video_url: l.video_url, watched: 0, duration: 0, started_ms: Date.now() };
      S.video_progress.push(v);
    }
    const allowed = ((Date.now() - v.started_ms) / 1000) * 1.05 + 15;
    v.duration = Math.max(0, Number(body.duration) || 0) || v.duration;
    v.watched = Math.min(Math.max(v.watched, Math.min(Math.max(0, Number(body.watched) || 0), allowed)), v.duration || Infinity);
    return { watched: v.watched, duration: v.duration, finished: v.duration > 0 && v.watched >= v.duration - 2 };
  });
  route('POST', '/my/assignments/:id/quiz', 'user', ({ user, params, body }) => {
    const a = myAssignment(user, params.id);
    const d = decorate(a);
    if (d.lessons_done < d.lessons_total) fail(400, 'Finish all lessons before taking the quiz');
    const qs = questionsOf(a.module_id);
    if (!qs.length) fail(400, 'This module has no quiz');
    const answers = (body.answers || []).map((x) => (x === null || x === undefined ? null : Number(x)));
    const correct = qs.map((q, i) => answers[i] === q.correct_index);
    const score = Math.round((correct.filter(Boolean).length / qs.length) * 100);
    const passed = score >= d.pass_mark ? 1 : 0;
    S.quiz_attempts.push({ id: nextId('quiz_attempts'), assignment_id: a.id, score, passed, answers: JSON.stringify(answers), created_at: nowStr() });
    a.best_score = Math.max(a.best_score || 0, score);
    refreshStatus(a);
    return { score, passed: !!passed, pass_mark: d.pass_mark, results: qs.map((q, i) => ({ correct: correct[i], correct_index: passed ? q.correct_index : undefined })), assignment: decorate(a) };
  });

  // ---------- fetch shim ----------
  const realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = async (input, opts = {}) => {
    const url = new URL(typeof input === 'string' ? input : input.url, 'http://demo.local');
    if (!url.pathname.startsWith('/api/')) return realFetch(input, opts);
    const path = url.pathname.slice(4);
    const method = (opts.method || 'GET').toUpperCase();
    const reply = (status, data) => new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
    try {
      for (const r of routes) {
        if (r.method !== method) continue;
        const m = path.match(r.re);
        if (!m) continue;
        const params = Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])]));
        const user = S.session ? S.users.find((u) => u.id === S.session && u.active) : null;
        if (r.role && !user) fail(401, 'Please sign in');
        if (r.role === 'admin' && user.role !== 'admin') fail(403, 'Admins only');
        const body = opts.body instanceof Blob ? opts.body : opts.body ? JSON.parse(opts.body) : {};
        const result = await r.fn({ params, query: url.searchParams, body, user });
        save();
        return reply(200, result);
      }
      fail(404, 'Not found');
    } catch (e) {
      if (!e.status) console.error(e);
      return reply(e.status || 500, { error: e.status ? e.message : 'Something went wrong' });
    }
    return reply(500, { error: 'Something went wrong' });
  };
})();

// Minimal, safe markdown: headings, bullets, bold, italics, links. Input is escaped first.
function renderContent(text) {
  const inline = (s) => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = '';
  let list = false;
  let para = [];
  const flush = () => { if (para.length) { html += `<p>${para.join(' ')}</p>`; para = []; } };
  for (const raw of esc(text).split('\n')) {
    const line = raw.trim();
    if (/^[-*] /.test(line)) {
      flush();
      if (!list) { html += '<ul>'; list = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      continue;
    }
    if (list) { html += '</ul>'; list = false; }
    if (!line) { flush(); continue; }
    const h = line.match(/^(#{1,3}) (.*)$/);
    if (h) { flush(); const n = h[1].length + 1; html += `<h${n}>${inline(h[2])}</h${n}>`; continue; }
    para.push(inline(line));
  }
  flush();
  if (list) html += '</ul>';
  return html;
}

const MAX_VIDEO_BYTES = 1024 * 1024 * 1024;
async function uploadVideo(file, onStatus) {
  if (!/^video\//.test(file.type) && !/\.(mp4|webm|mov|m4v|ogg)$/i.test(file.name)) throw new Error('Please choose a video file (MP4, WebM or MOV)');
  if (file.size > MAX_VIDEO_BYTES) throw new Error('This video is larger than 1 GB. Please compress it and try again.');
  const label = `Uploading ${file.name} (${(file.size / 1048576).toFixed(1)} MB)`;
  onStatus?.(`${label}…`);
  if (state.config.blobUploads) {
    // Online: the video goes straight from the browser to Vercel Blob storage.
    await loadScript('/vendor/blob-upload.js');
    const target = `videos/${file.name.replace(/[^\w.-]+/g, '-')}`;
    const options = (access) => ({
      access,
      handleUploadUrl: '/api/uploads/blob',
      multipart: file.size > 50 * 1048576,
      onUploadProgress: ({ percentage }) => onStatus?.(`${label}: ${Math.round(percentage)}%`),
    });
    const tidy = (e) => new Error(e.message?.replace(/^Vercel Blob: /, '') || 'Upload failed');
    if (state.config.blobUploads === 'presigned') {
      // Store-id stores are private or public; try private first, then public.
      for (const access of ['private', 'public']) {
        try {
          const blob = await window.BlobUpload.uploadPresigned(target, file, options(access));
          onStatus?.('');
          return `/api/media/${access}/${encodeURIComponent(blob.pathname)}`;
        } catch (e) {
          if (access === 'public') throw tidy(e);
        }
      }
    }
    const blob = await window.BlobUpload.upload(target, file, options('public')).catch((e) => { throw tidy(e); });
    onStatus?.('');
    return blob.url;
  }
  const res = await fetch(`/api/uploads?name=${encodeURIComponent(file.name)}`, {
    method: 'POST', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Upload failed');
  onStatus?.('');
  return data.url;
}

function loadScript(src) {
  loadScript.cache ||= {};
  return (loadScript.cache[src] ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { delete loadScript.cache[src]; reject(new Error('Could not load the uploader. Please refresh and try again.')); };
    document.head.appendChild(s);
  }));
}

async function router() {
  if (!state.user) return;

function askConfirm(message, okLabel = 'Confirm') {
  return new Promise((resolve) => {
    openDialog(`<div class="dlg"><h2>Are you sure?</h2><p>${esc(message)}</p>
      <div class="dlg-foot"><button type="button" id="confirm-no">Cancel</button><button type="button" class="primary" id="confirm-yes">${esc(okLabel)}</button></div></div>`, (dlg) => {
      let answered = false;
      const done = (v) => { answered = true; dialog.close(); resolve(v); };
      $('#confirm-yes', dlg).addEventListener('click', () => done(true));
      $('#confirm-no', dlg).addEventListener('click', () => done(false));
      dialog.addEventListener('close', () => { if (!answered) resolve(false); }, { once: true });
    });
  });
}

}

// ---------- spreadsheet reading (.xlsx and .csv, no library needed) ----------
async function unzipEntries(buf) {
  const view = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('This file is not a valid Excel (.xlsx) file');
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const entries = {};
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    const method = view.getUint16(p + 10, true);
    const size = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const local = view.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nameLen));
    const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
    entries[name] = { method, data: new Uint8Array(buf, start, size) };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return async (name) => {
    const e = entries[name];
    if (!e) return null;
    if (e.method === 0) return dec.decode(e.data);
    const stream = new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  };
}

const xmlNodes = (el, tag) => [...el.getElementsByTagNameNS('*', tag)];
const xmlText = (el) => xmlNodes(el, 't').map((t) => t.textContent).join('');

async function readSpreadsheet(file) {
  if (/\.xls$/i.test(file.name)) throw new Error('Old .xls files are not supported. In Excel, use File > Save As > Excel Workbook (.xlsx).');
  if (/\.(csv|txt)$/i.test(file.name)) {
    return (await file.text()).split(/\r?\n/).filter((l) => l.trim()).map((line) => {
      const cells = []; let cur = ''; let q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
        else if (c === '"') q = true; else if (c === ',') { cells.push(cur); cur = ''; } else cur += c;
      }
      cells.push(cur);
      return cells.map((c) => c.trim());
    });
  }
  const read = await unzipEntries(await file.arrayBuffer());
  const parse = (xml) => new DOMParser().parseFromString(xml, 'application/xml');
  const sharedXml = await read('xl/sharedStrings.xml');
  const shared = sharedXml ? xmlNodes(parse(sharedXml), 'si').map(xmlText) : [];
  // Use the first sheet in the workbook.
  let sheetPath = 'xl/worksheets/sheet1.xml';
  const wb = await read('xl/workbook.xml');
  const rels = await read('xl/_rels/workbook.xml.rels');
  if (wb && rels) {
    const first = xmlNodes(parse(wb), 'sheet')[0];
    const rid = first && (first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'));
    const rel = xmlNodes(parse(rels), 'Relationship').find((r) => r.getAttribute('Id') === rid);
    if (rel) sheetPath = `xl/${rel.getAttribute('Target').replace(/^\/?xl\//, '').replace(/^\//, '')}`;
  }
  const sheetXml = await read(sheetPath);
  if (!sheetXml) throw new Error('Could not find a sheet in this file');
  const colIndex = (ref) => [...ref.replace(/\d+/g, '')].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
  return xmlNodes(parse(sheetXml), 'row').map((row) => {
    const out = [];
    xmlNodes(row, 'c').forEach((c, i) => {
      const ref = c.getAttribute('r');
      const idx = ref ? colIndex(ref) : i;
      const type = c.getAttribute('t');
      const v = xmlNodes(c, 'v')[0]?.textContent ?? '';
      out[idx] = type === 's' ? shared[Number(v)] ?? '' : type === 'inlineStr' ? xmlText(c) : v;
    });
    return Array.from(out, (x) => String(x ?? '').trim());
  }).filter((r) => r.some(Boolean));
}

const HEADER_KEYS = {
  email: ['email', 'emailid', 'emailaddress', 'workemail', 'officialemail', 'officialemailid', 'mail'],
  name: ['name', 'fullname', 'employeename', 'empname'],
  department: ['department', 'dept', 'function', 'team'],
  designation: ['designation', 'title', 'jobtitle', 'position'],
  joining_date: ['joiningdate', 'dateofjoining', 'doj', 'joindate', 'startdate'],
  role: ['role', 'access', 'accesslevel', 'admin'],
};

function excelDate(v) {
  if (/^\d+(\.\d+)?$/.test(v) && Number(v) > 20000) {
    return new Date(Date.UTC(1899, 11, 30) + Math.floor(Number(v)) * 864e5).toISOString().slice(0, 10);
  }
  const dmy = v.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);
  if (dmy) return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;
  return v;
}

// Turns sheet rows into employee records using the header row.
function rowsToPeople(rows) {
  if (!rows.length) throw new Error('The sheet is empty');
  const header = rows[0].map((h) => h.toLowerCase().replace(/[^a-z]/g, ''));
  const col = {};
  for (const [key, names] of Object.entries(HEADER_KEYS)) col[key] = header.findIndex((h) => names.includes(h));
  if (col.email < 0) throw new Error('Add a column called "Email" in the first row of the sheet');
  return rows.slice(1).map((r) => {
    const get = (k) => (col[k] >= 0 ? r[col[k]] || '' : '');
    return { email: get('email').toLowerCase(), name: get('name'), department: get('department'), designation: get('designation'), joining_date: get('joining_date') ? excelDate(get('joining_date')) : '', role: /^(admin|yes|y)$/i.test(get('role').trim()) ? 'admin' : '' };
  });
}

// Inside the claude.ai viewer a plain download link is blocked, so the demo saves sample files through the viewer.
function demoDownload(link) {
  if (!window.LMS_DEMO || !window.claude?.use) return;
  link.addEventListener('click', async (e) => {
    e.preventDefault();
    const downloads = await window.claude.use('downloads').catch(() => null);
    if (!downloads) { toast('Downloading works in the hosted version', 'error'); return; }
    const data = Uint8Array.from(atob(link.href.split(',')[1]), (c) => c.charCodeAt(0));
    downloads.save({ filename: link.getAttribute('download'), data }).catch((err) => {
      if (err?.code !== 'declined') toast('Could not download the sample file here', 'error');
    });
  });
}

    $('#pick-dept', dlg).addEventListener('change', filter);
    $('#pick-all', dlg).addEventListener('click', () => { $$('#pick-list label:not([hidden]) input', dlg).forEach((i) => { i.checked = true; }); count(); });
    $('#pick-none', dlg).addEventListener('click', () => { $$('#pick-list input', dlg).forEach((i) => { i.checked = false; }); count(); });
    $('#pick-list', dlg).addEventListener('change', count);
    count();

    // Bulk upload
    const renderPreview = () => {
      const box = $('#sheet-preview', dlg);
      if (!people) { box.innerHTML = ''; return; }
      const create = $('#create-missing', dlg).checked;
      const rowsHtml = people.map((p, i) => {
        const existing = byEmail.get(p.email);
        let status;

        else if (existing && !existing.active) status = '<span class="badge red">Deactivated</span>';
        else if (existing) status = '<span class="badge green">Employee found</span>';
        else if (create && p.name) status = '<span class="badge blue">Will be added</span>';
        else status = `<span class="badge red">${create ? 'Name missing' : 'Not in system'}</span>`;
        return `<tr><td class="num sub">${i + 2}</td><td>${esc(p.name || existing?.name || '')}<div class="sub">${esc(p.email)}</div></td><td>${esc(p.department || existing?.department || '')}</td><td>${status}</td></tr>`;
      }).join('');
      const ok = people.filter((p) => { const e = byEmail.get(p.email); return e ? e.active : create && p.name && /@/.test(p.email); }).length;
      box.innerHTML = `<div class="hint" style="margin-top:10px"><strong>${people.length}</strong> row${people.length === 1 ? '' : 's'} read · <strong>${ok}</strong> ready to assign</div>

    $('#choose-file', dlg).addEventListener('click', () => $('#sheet-file', dlg).click());
    $('#sheet-file', dlg).addEventListener('change', (e) => loadFile(e.target.files[0]));
    $('#create-missing', dlg).addEventListener('change', renderPreview);
    const drop = $('#drop', dlg);
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); loadFile(e.dataTransfer.files[0]); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        if (current === 'upload') {
          if (!people) throw new Error('Choose an Excel file first');
          const r = await api('/assignments/bulk', { method: 'POST', body: {
            module_id: sel.value, due_date: due.value, note: form.note.value, rows: people, create_missing: $('#create-missing', dlg).checked,
            notify: $('#notify', dlg).checked,
          } });
          toast(`Assigned to ${r.created} employee${r.created === 1 ? '' : 's'}${r.new_employees ? ` (${r.new_employees} newly added)` : ''}${r.skipped ? `, ${r.skipped} skipped (already assigned)` : ''}${emailNote(r)}`);
          onDone?.();
          if (r.errors.length) {
            $('#assign-errors', dlg).innerHTML = `<div class="result fail">${r.errors.length} row(s) not assigned:<br>${r.errors.map((x) => `Row ${x.row}: ${esc(x.error)}`).join('<br>')}</div>`;
            return;
          }
          dialog.close();
          return;
        }
        const r = await api('/assignments', { method: 'POST', body: {
          module_id: sel.value, due_date: due.value, note: form.note.value,
          user_ids: $$('#pick-list input:checked', dlg).map((i) => Number(i.value)),

        toast(`Assigned to ${r.created} employee${r.created === 1 ? '' : 's'}${r.skipped ? `, ${r.skipped} skipped (already assigned)` : ''}${emailNote(r)}`);
        onDone?.();
      } catch (err) { toast(err.message, 'error'); }
    });
  });
}

async function viewModuleEditor(id) {
  const draft = id ? await api(`/modules/${id}`) : {
    title: '', description: '', category: '', is_onboarding: 0, onboarding_departments: '', due_days: 7, pass_mark: 70, published: 1,
    lessons: [{ title: '', content: '', video_url: '' }], questions: [],
  };
  const view = $('#view');

  const render = () => {
    view.innerHTML = `
      <div class="page-head"><div><a href="#/modules" class="sub">← Modules</a><h1>${id ? 'Edit module' : 'Create custom module'}</h1></div>
        <div class="actions">${id ? '<button class="danger" id="delete">Delete</button>' : ''}<button class="primary" id="save">Save module</button></div></div>
      <div class="card" style="margin-bottom:16px">
        <h2>Details</h2>
        <div class="field"><label>Title</label><input type="text" data-k="title" value="${esc(draft.title)}" placeholder="e.g. Information Security Basics"></div>
        <div class="field"><label>Description</label><input type="text" data-k="description" value="${esc(draft.description)}"></div>
        <div class="row">
          <div class="field"><label>Category</label><input type="text" data-k="category" value="${esc(draft.category)}" placeholder="Onboarding, Compliance, Skills…"></div>
          <div class="field"><label>Due within (days)</label><input type="number" min="0" data-k="due_days" value="${esc(draft.due_days)}"><div class="hint">From joining date for onboarding, from assignment otherwise.</div></div>
          <div class="field"><label>Quiz pass mark (%)</label><input type="number" min="0" max="100" data-k="pass_mark" value="${esc(draft.pass_mark)}"></div>
        </div>
        <label class="check" style="margin-bottom:8px"><input type="checkbox" data-k="published" ${draft.published ? 'checked' : ''}> Published (draft modules can't be assigned)</label>
        <label class="check"><input type="checkbox" data-k="is_onboarding" ${draft.is_onboarding ? 'checked' : ''}> Onboarding module: assign automatically when an employee joins</label>
        <div class="field" style="margin:10px 0 0 24px" ${draft.is_onboarding ? '' : 'hidden'} id="dept-field"><label>Only for departments (comma separated, blank = everyone)</label><input type="text" data-k="onboarding_departments" value="${esc(draft.onboarding_departments)}" placeholder="e.g. Sales, Support"></div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <h2>Lessons</h2>
        <p class="sub" style="margin-top:-6px">Content supports simple formatting: <code># Heading</code>, <code>- bullet</code>, <code>**bold**</code>, <code>[link](https://…)</code>. Each lesson can have an uploaded video or a YouTube / Vimeo link.</p>
        ${draft.lessons.map((l, i) => `
          <div class="block">
            <div class="block-head"><strong>Lesson ${i + 1}</strong><div class="actions">
              <button class="small" data-move-lesson="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>↑</button>
              <button class="small" data-move-lesson="${i}" data-dir="1" ${i === draft.lessons.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="small danger" data-del-lesson="${i}" ${draft.lessons.length === 1 ? 'disabled' : ''}>Remove</button></div></div>
            <div class="field"><label>Title</label><input type="text" data-lesson="${i}" data-f="title" value="${esc(l.title)}"></div>
            <div class="field"><label>Video (optional)</label>
              ${isUploadedVideo(l.video_url)
                ? `<div class="upload-row"><span class="badge green">🎬 ${esc(uploadedName(l.video_url))}</span><button type="button" class="small" data-upload="${i}">Replace video</button><button type="button" class="small danger" data-clear-video="${i}">Remove video</button></div>
                   <div class="lesson-preview">${uploadedVideoTag(l.video_url)}</div>`
                : `<div class="upload-row"><button type="button" class="small" data-upload="${i}">⬆ Upload video file</button><span class="sub">MP4, WebM or MOV, up to 1 GB · or paste a YouTube / Vimeo link:</span></div>
                   <input type="url" data-lesson="${i}" data-f="video_url" value="${esc(l.video_url)}" placeholder="https://www.youtube.com/watch?v=…" style="margin-top:6px">`}
              <div class="upload-status" id="upload-status-${i}"></div>
              <input type="file" accept="video/mp4,video/webm,video/quicktime,video/ogg,.mp4,.webm,.mov,.m4v,.ogg" data-file="${i}" hidden>
            </div>
            <div class="field"><label>Content</label><textarea data-lesson="${i}" data-f="content">${esc(l.content)}</textarea></div>
          </div>`).join('')}
        <button id="add-lesson">+ Add lesson</button>
      </div>
      <div class="card">
        <h2>Quiz</h2>
        <p class="sub" style="margin-top:-6px">Optional. Learners take it after finishing all lessons and must reach the pass mark to complete the module. Select the radio button next to the correct answer.</p>
        ${draft.questions.map((q, i) => `
          <div class="block">
            <div class="block-head"><strong>Question ${i + 1}</strong><button class="small danger" data-del-q="${i}">Remove</button></div>
            <div class="field"><input type="text" data-q="${i}" data-f="text" value="${esc(q.text)}" placeholder="Question"></div>
            ${q.options.map((o, j) => `<div class="option-row">
              <input type="radio" name="correct-${i}" data-correct="${i}" value="${j}" ${q.correct_index === j ? 'checked' : ''} title="Correct answer">
              <input type="text" data-q="${i}" data-opt="${j}" value="${esc(o)}" placeholder="Option ${j + 1}">
              <button class="small" data-del-opt="${i}" data-j="${j}" ${q.options.length <= 2 ? 'disabled' : ''}>✕</button></div>`).join('')}
            <button class="small link" data-add-opt="${i}" ${q.options.length >= 6 ? 'disabled' : ''}>+ Add option</button>
          </div>`).join('')}
        <button id="add-q">+ Add question</button>
      </div>`;
    hydrateVideos(view);
  };

  render();

  const onUpload = async (e) => {
    const input = e.target;
    if (!input.files[0]) return;
    const i = Number(input.dataset.file);
    const status = $(`#upload-status-${i}`);
    const save = $('#save');
    try {
      save.disabled = true;
      draft.lessons[i].video_url = await uploadVideo(input.files[0], (msg) => { status.textContent = msg; });
      toast('Video uploaded');
      render();
    } catch (err) {
      status.textContent = '';
      toast(err.message, 'error');
    } finally {
      if ($('#save')) $('#save').disabled = false;
    }
  };

  // Inputs write straight into the draft; structural changes re-render.
  view.oninput = view.onchange = (e) => {
    const t = e.target;
    if (t.dataset.file !== undefined) { if (e.type === 'change') onUpload(e); return; }
    if (t.dataset.k) {
      draft[t.dataset.k] = t.type === 'checkbox' ? (t.checked ? 1 : 0) : t.value;
      if (t.dataset.k === 'is_onboarding') $('#dept-field').hidden = !t.checked;
    } else if (t.dataset.lesson !== undefined) draft.lessons[t.dataset.lesson][t.dataset.f] = t.value;
    else if (t.dataset.opt !== undefined) draft.questions[t.dataset.q].options[t.dataset.opt] = t.value;
    else if (t.dataset.q !== undefined) draft.questions[t.dataset.q][t.dataset.f] = t.value;
    else if (t.dataset.correct !== undefined) draft.questions[t.dataset.correct].correct_index = Number(t.value);
  };

  view.onclick = async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.upload !== undefined) { $(`[data-file="${d.upload}"]`).click(); return; }
    if (d.clearVideo !== undefined) { draft.lessons[d.clearVideo].video_url = ''; render(); return; }
    if (b.id === 'add-lesson') { draft.lessons.push({ title: '', content: '', video_url: '' }); render(); }
    else if (d.delLesson !== undefined) { draft.lessons.splice(Number(d.delLesson), 1); render(); }
    else if (d.moveLesson !== undefined) {
      const i = Number(d.moveLesson); const j = i + Number(d.dir);
      [draft.lessons[i], draft.lessons[j]] = [draft.lessons[j], draft.lessons[i]];
      render();
    } else if (b.id === 'add-q') { draft.questions.push({ text: '', options: ['', '', '', ''], correct_index: null }); render(); }
    else if (d.delQ !== undefined) { draft.questions.splice(Number(d.delQ), 1); render(); }
    else if (d.addOpt !== undefined) { draft.questions[d.addOpt].options.push(''); render(); }
    else if (d.delOpt !== undefined) {
      const q = draft.questions[d.delOpt]; const j = Number(d.j);
      q.options.splice(j, 1);
      if (q.correct_index === j) q.correct_index = null; else if (q.correct_index > j) q.correct_index--;
      render();
    } else if (b.id === 'save') {
      try {
        const body = { ...draft, questions: draft.questions.map((q) => ({ ...q, options: q.options.filter((o) => o.trim()) })) };
        // Keep the correct answer pointing at the same option after blank options are dropped.
        body.questions.forEach((q, i) => {
          const orig = draft.questions[i];
          if (orig.correct_index != null) q.correct_index = q.options.indexOf(orig.options[orig.correct_index]);
        });
        await api(id ? `/modules/${id}` : '/modules', { method: id ? 'PUT' : 'POST', body });
        toast('Module saved');
        location.hash = '#/modules';
      } catch (err) { toast(err.message, 'error'); }
    } else if (b.id === 'delete') {
      if (!(await askConfirm('Delete this module? All assignments and progress for it will be deleted. To hide it instead, untick Published.', 'Delete module'))) return;
      try { await api(`/modules/${id}`, { method: 'DELETE' }); toast('Module deleted'); location.hash = '#/modules'; }
      catch (err) { toast(err.message, 'error'); }
    }
  };
}

    </div>
    <div class="card flush"><div class="table-wrap"><table>
      <thead><tr><th>Employee</th><th>Module</th><th>Source</th><th>Due</th><th>Status</th><th>Progress</th><th class="num">Score</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div></div>`;
  const filters = $('#filters');
  ['module_id', 'department', 'status', 'source'].forEach((k) => { filters.querySelector(`[name=${k}]`).value = params.get(k) || ''; });
  const query = () => {
    const p = new URLSearchParams();
    $$('[name]', filters).forEach((el) => { if (el.value) p.set(el.name, el.value); });
    return p;
  };
  const load = async () => {
    const p = query();
    sessionStorage.setItem('assignFilters', p.toString());
    $('#export').href = `/api/assignments.csv?${p}`;
    if (window.LMS_DEMO) $('#export').onclick = (e) => { e.preventDefault(); toast('CSV export works in the installed version'); };
    const rows = await api(`/assignments?${p}`);
    $('#rows').innerHTML = assignmentRows(rows);
    bindAssignmentActions(load);
  };
  let timer;
  filters.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 250); });
  $('#assign').addEventListener('click', () => openAssignDialog({ moduleId: query().get('module_id') || '', onDone: load }));
  $('#bulk').addEventListener('click', () => openAssignDialog({ moduleId: query().get('module_id') || '', onDone: load, tab: 'upload' }));
  await load();
}
